name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: EXE und ZIP bauen
        shell: powershell
        run: ./build/Build-Exe.ps1 -Out dist

      - name: Release anlegen
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/WinServBackup-Setup.exe dist/WinServBackup.zip dist/SHA256SUMS --title "WinServBackup ${{ github.ref_name }}" --generate-notes
