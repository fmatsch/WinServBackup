name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Server (PowerShell 5.1)
            os: windows-latest
          - name: Windows 11 ARM64 (PowerShell 5.1)
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Statische Prüfung (Syntax, BOM, XAML)
        shell: powershell
        run: ./tests/static.ps1

      - name: Oberfläche laden (Selbsttest)
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File src/Gui/App.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File recovery/Restore/Restore.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: End-to-End (VSS-Backup, Aufbewahrung, Zeitplan, Restore)
        shell: powershell
        run: ./tests/e2e.ps1

      - name: EXE bauen und testen (Starter, Setup, Installation)
        shell: powershell
        run: ./tests/exe.ps1

      - name: EXE-Dateien als Artefakt
        if: success() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: WinServBackup-exe
          path: dist/WinServBackup-Setup.exe
